<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>FeLid Live Visual Studio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090909;color:#eee;font-family:system-ui,-apple-system,sans-serif}
body{overflow:hidden}.studio{height:100dvh;display:grid;grid-template-rows:auto 1fr}.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid #262626;background:#0d0d0d}
.brand{font-weight:800;font-size:13px;letter-spacing:.02em}.hint{font-size:11px;color:#999;line-height:1.45;flex:1}.hint b{color:#dfffb5}.links{display:flex;gap:7px}.links a{color:#ddd;text-decoration:none;border:1px solid #333;border-radius:8px;padding:7px 9px;font-size:11px}
.split{min-height:0;display:grid;grid-template-columns:minmax(420px,1.08fr) minmax(360px,.92fr);gap:1px;background:#252525}
.pane{position:relative;min-width:0;min-height:0;background:#0b0b0b}.tag{position:absolute;z-index:3;top:8px;left:8px;background:#000c;border:1px solid #333;color:#bbb;border-radius:999px;padding:4px 8px;font-size:9px;pointer-events:none}
iframe{display:block;width:100%;height:100%;border:0;background:#090909}
@media(max-width:900px){body{overflow:auto}.studio{height:auto;min-height:100dvh}.split{grid-template-columns:1fr;grid-template-rows:72dvh 82dvh}.bar{position:sticky;top:0;z-index:10}.hint{min-width:100%}}
</style>
</head>
<body>
<div class="studio">
  <header class="bar">
    <div class="brand">FeLid LIVE VISUAL STUDIO</div>
    <div class="hint"><b>1.</b> 左のGeneratorでPLAY　→　<b>2.</b> 右で写真を選ぶ　→　<b>3.</b> LIVE GENERATOR / CONNECT LIVE　→　<b>4.</b> START LIVE VISUAL または RECORD LIVE 30s</div>
    <div class="links"><a href="/" target="_blank">GENERATOR ↗</a><a href="/video-lab" target="_blank">VIDEO LAB ↗</a></div>
  </header>
  <main class="split">
    <section class="pane">
      <div class="tag">KARESANSUI IN THE AIR — GENERATOR</div>
      <iframe id="generatorFrame" src="/?studio=1" allow="autoplay"></iframe>
    </section>
    <section class="pane">
      <div class="tag">AUDIO REACTIVE VISUAL</div>
      <iframe id="visualFrame" src="/video-lab?studio=1" allow="autoplay"></iframe>
    </section>
  </main>
</div>
</body>
</html>
