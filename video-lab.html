<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#090909" />
<title>FeLid Audio Reactive Video Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#eee;font-family:system-ui,-apple-system,sans-serif;padding:18px}.wrap{max-width:880px;margin:auto}h1{font-size:22px;margin:0 0 6px}.sub{color:#888;font-size:13px;line-height:1.5;margin-bottom:18px}.panel{background:#111;border:1px solid #292929;border-radius:14px;padding:14px;margin:12px 0}.row{display:grid;gap:10px}.row2{grid-template-columns:1fr 1fr}.label{font-size:12px;color:#aaa;margin-bottom:6px}.file{display:block;border:1px dashed #444;border-radius:10px;padding:12px;background:#0c0c0c}.file input{width:100%}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button,a.btn{appearance:none;border:1px solid #3a3a3a;background:#161616;color:#eee;border-radius:10px;padding:11px 14px;font-weight:600;text-decoration:none}button.primary{background:#e8ffc8;color:#111;border-color:#e8ffc8}button:disabled{opacity:.35}.status{font-size:12px;color:#aaa;margin-top:9px;min-height:18px}.stage{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:9/16;max-height:70vh;margin:auto}.stage.landscape{aspect-ratio:16/9}.stage canvas{width:100%;height:100%;display:block}.hud{position:absolute;left:10px;bottom:10px;font-size:10px;color:#ddd;background:#0008;padding:6px 8px;border-radius:8px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.control{background:#0c0c0c;border:1px solid #242424;border-radius:10px;padding:10px}.control label{display:flex;justify-content:space-between;font-size:11px;color:#aaa;margin-bottom:6px}.control input{width:100%}.thumbs{display:flex;gap:6px;overflow:auto;padding-top:8px}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid #333}.note{font-size:11px;color:#777;line-height:1.55}.download{display:none;margin-top:12px}.download.show{display:inline-block}@media(min-width:700px){.row.main{grid-template-columns:320px 1fr;align-items:start}.stage{max-height:none}.controls{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
  <h1>FeLid Audio Reactive Video Lab</h1>
  <div class="sub">WAV 1曲 + iPhone写真複数枚 → 音に反応して変化する映像を生成する実験版</div>

  <div class="row main">
    <div>
      <div class="panel">
        <div class="label">1. WAVを選択</div>
        <label class="file"><input id="audioInput" type="file" accept="audio/wav,audio/*"></label>
        <div class="label" style="margin-top:12px">2. 写真を複数選択</div>
        <label class="file"><input id="imageInput" type="file" accept="image/*" multiple></label>
        <div id="thumbs" class="thumbs"></div>
        <div class="actions">
          <button id="previewBtn" class="primary" disabled>PREVIEW</button>
          <button id="recordBtn" disabled>RECORD VIDEO</button>
          <button id="stopBtn" disabled>STOP</button>
        </div>
        <div id="status" class="status">WAVと写真を選択してください。</div>
        <a id="downloadLink" class="btn download">VIDEO DOWNLOAD</a>
      </div>

      <div class="panel">
        <div class="controls">
          <div class="control"><label><span>PHOTO CHANGE</span><span id="changeOut">8.0s</span></label><input id="change" type="range" min="2" max="20" step="0.5" value="8"></div>
          <div class="control"><label><span>ZOOM RESPONSE</span><span id="zoomOut">36%</span></label><input id="zoom" type="range" min="0" max="100" value="36"></div>
          <div class="control"><label><span>BRIGHTNESS RESPONSE</span><span id="brightOut">30%</span></label><input id="bright" type="range" min="0" max="100" value="30"></div>
          <div class="control"><label><span>GLITCH / SHAKE</span><span id="shakeOut">12%</span></label><input id="shake" type="range" min="0" max="100" value="12"></div>
        </div>
        <div class="actions">
          <button id="portraitBtn">9:16</button>
          <button id="landscapeBtn">16:9</button>
          <button id="randomizeBtn">RANDOMIZE LOOK</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div id="stage" class="stage">
        <canvas id="canvas" width="1080" height="1920"></canvas>
        <div id="hud" class="hud">waiting</div>
      </div>
    </div>
  </div>

  <div class="panel note">
    写真ライブラリ全体を自動で読み取ることはできないため、最初にiPhoneの写真選択画面から複数枚選んでください。選んだ写真の中からはランダムに切り替わります。音量でズーム、低域で揺れ、高域で明暗が変化します。録画形式は端末が対応するMediaRecorder形式を自動選択します。
  </div>
</div>
<script src="/video-lab.js" defer></script>
</body>
</html>
