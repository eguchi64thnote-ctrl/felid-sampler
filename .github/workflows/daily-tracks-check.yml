name: Daily Tracks source checks

on:
  pull_request:
    paths:
      - 'api/**'
      - 'lib/**'
      - 'scripts/**'
      - 'package.json'
      - 'wav-restore.html'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check JavaScript syntax
        run: |
          node --check lib/daily-storage.js
          node --check lib/wav-encryption.js
          node --check api/inbox.js
          node --check api/latest.js
          node --check scripts/daily-generate.mjs
          node --check scripts/migrate-blob-to-r2.mjs
          node --check scripts/test-wav-encryption.mjs
          node --check api/purge-felid-blob.js
          node --check scripts/purge-felid-blob.mjs
      - name: Check encrypted WAV can be restored and rejects tampering
        run: node scripts/test-wav-encryption.mjs
