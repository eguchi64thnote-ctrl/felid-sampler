name: FeLid Daily Tracks

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium

      - name: Get GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          TOKEN="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=felid-daily-tracks" | jq -r '.value')"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Generate, novelty-check, and archive 3 tracks
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          DAILY_BASE_URL: https://karesansui-in-the-air-gnr-mhver.vercel.app
        run: node scripts/daily-generate.mjs
