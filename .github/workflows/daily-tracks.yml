name: FeLid Daily Tracks

on:
  schedule:
    - cron: '0 21 * * *'
    - cron: '0 3 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Check MP3 encoder
        run: ffmpeg -hide_banner -version | head -n 1

      - name: Get GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          TOKEN="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=felid-daily-tracks" | jq -r '.value')"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Generate, novelty-check, and archive 3 tracks
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          DAILY_BASE_URL: https://karesansui-in-the-air-gnr-mhver.vercel.app
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        shell: bash
        run: |
          case "$SCHEDULE_EXPR" in
            "0 21 * * *") export DAILY_SLOT=0600 ;;
            "0 3 * * *") export DAILY_SLOT=1200 ;;
            "0 7 * * *") export DAILY_SLOT=1600 ;;
            *) HOUR=$(TZ=Asia/Tokyo date +%H); if [ "$HOUR" -lt 9 ]; then export DAILY_SLOT=0600; elif [ "$HOUR" -lt 15 ]; then export DAILY_SLOT=1200; else export DAILY_SLOT=1600; fi ;;
          esac
          echo "Generating slot: $DAILY_SLOT"
          node scripts/daily-generate.mjs

      - name: Prepare encrypted artifact identifier
        id: trackinfo
        shell: bash
        run: |
          echo "date=$(TZ=Asia/Tokyo date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          case "$SCHEDULE_EXPR" in
            "0 21 * * *") SLOT=0600 ;;
            "0 3 * * *") SLOT=1200 ;;
            "0 7 * * *") SLOT=1600 ;;
            *) HOUR=$(TZ=Asia/Tokyo date +%H); if [ "$HOUR" -lt 9 ]; then SLOT=0600; elif [ "$HOUR" -lt 15 ]; then SLOT=1200; else SLOT=1600; fi ;;
          esac
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule }}

      # GitHub repository is public. Store only AES-256-GCM ciphertext;
      # never upload WAV or the private per-track keys as workflow artifacts.
      - name: Offer encrypted WAV archive for one day
        uses: actions/upload-artifact@v4
        with:
          name: felid-wav-${{ steps.trackinfo.outputs.date }}-${{ steps.trackinfo.outputs.slot }}-${{ github.run_id }}
          path: daily-output-encrypted/*.wav.enc
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
